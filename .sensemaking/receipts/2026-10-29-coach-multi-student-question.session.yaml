  - id: Q-3
    question: "Is a human coach (a) the product's design customer, (b) a supported secondary operator over the self-directed learner product, or (c) out of scope for now? And if (a)/(b): may the coach author/confirm M7 hypotheses, and may a coach assignment stand in for M9 selection or only annotate it?"
    source: owner_intent
    blocking: true
    options:
      - option: "(c) out of scope / defer"
        consequence: "No change; poss:coach-mediated-product stays a retained counterfactual. PATH-1 proceeds as before."
      - option: "(b) secondary local operator"
        consequence: "Answers Q-2 as operator-confirmed with coach as operator; PATH-1/T2 designed so hypothesis confirmation is a human (coach) act; coach assignment recorded as human-provenance M9 mapping, M9 selection unchanged. Local single-machine, one store, many participant_ids."
      - option: "(a) coach as design customer"
        consequence: "Product-discovery revision and new validation (coach interviews/pilot) before architecture; likely ADRs for a coach actor, cross-participant read-only roster, and coach assignment authority distinct from M9."
    durable_ref: null
