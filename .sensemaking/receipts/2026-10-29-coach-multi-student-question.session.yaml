findings:
  - id: F-1
    statement: "The store and every learner artifact are participant-scoped, and cross-participant dependencies are rejected (IntegrityError). Several students are already representable as several participant_ids in one local store; there is no cross-participant read surface and no coach/actor identity in the store."
    epistemic_status: OBSERVED
    evidence_refs: [src/chess_mentor_engine/storage/store.py:118-125, src/chess_mentor_engine/storage/store.py:163-164]
    disposition: open
  - id: F-2
    statement: "Human authorship is already a first-class provenance kind: M7 hypotheses carry HypothesisActorProvenance (human|model|system) and M9 mappings carry human|model actors. A coach-authored or coach-confirmed hypothesis fits existing contracts; the coach role is close to the 'operator-confirmed' option of open question Q-2."
    epistemic_status: OBSERVED
    evidence_refs: [src/chess_mentor_engine/learning/hypothesis_model.py:11-96, src/chess_mentor_engine/training/model.py:10-106, docs/decisions/0008-training-intervention-registry-contract.md]
    disposition: open
  - id: F-3
    statement: "'Assign targeted practice' collides with M9 authority: M9 v1 selects deterministically only when the hypothesis is supported_recurrence and exactly one registered mapping is applicable. A coach assignment that overrides or bypasses that is a new authority, not a UI over the existing one; ADR 0011 also excludes select/assign M9 training from the CLI."
    epistemic_status: OBSERVED
    evidence_refs: [docs/decisions/0008-training-intervention-registry-contract.md:91-125, docs/decisions/0011-local-evidence-cli-contract.md:51]
    disposition: open
  - id: F-4
    statement: "The coach request inherits the cold-start wall and library-only learner loop: no command creates M7 hypotheses from sessions and M6-M44 have no store writer, so there is nothing per-student for a coach to review until PATH-1/T1-T2 exist."
    epistemic_status: OBSERVED
    evidence_refs: [src/chess_mentor_engine/learner_intelligence/next_session.py:543, src/chess_mentor_engine/storage/store.py]
    disposition: open
  - id: F-5
    statement: "Product discovery names a 1400-1800 self-directed online player as design customer and lists the human coach as an alternative, not a user; the research protocol already casts 'a researcher or coach' as the manual analyst. Making the coach the user is a design-customer change (owner decision), and multi-user/hosted access stays outside repository authority per STATUS.md."
    epistemic_status: OBSERVED
    evidence_refs: [docs/product/product-discovery.md:20-40, docs/product/product-discovery.md:126, docs/product/product-discovery.md:264, STATUS.md]
    disposition: open
