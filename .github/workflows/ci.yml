name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -rs

      - name: Run Ruff
        run: ruff check .

      - name: Compile source and tests
        run: python -m compileall -q src tests tools

  release-distribution:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install release build tooling
        run: python -m pip install "build>=1.2,<2" "setuptools>=68"

      - name: Build wheel and source distribution
        run: python -m build --no-isolation --wheel --sdist --outdir dist

      - name: Validate built artifact contract
        run: |
          python -m tools.release_qualification \
            --wheel dist/chess_mentor_engine-1.0.0-py3-none-any.whl \
            --sdist dist/chess_mentor_engine-1.0.0.tar.gz \
            --expected-version 1.0.0

      - name: Create clean release environment
        run: python -m venv .release-venv

      - name: Install built wheel without dependency resolution
        run: |
          .release-venv/bin/python -m pip install \
            --no-index \
            --no-deps \
            dist/chess_mentor_engine-1.0.0-py3-none-any.whl

      - name: Smoke installed console entry points
        run: |
          for command in \
            cme \
            cme-candidate-tutor \
            cme-coach-review \
            cme-reviewed-coaching \
            cme-reviewed-coaching-ledger \
            cme-coach-review-reference \
            cme-persisted-coach-review-reference \
            cme-participant-review \
            cme-local-tutor
          do
            ".release-venv/bin/${command}" --help >/dev/null
          done

      - name: Smoke installed metadata and package data
        run: |
          .release-venv/bin/python - <<'PY'
          import json
          from importlib.metadata import version
          from importlib.resources import files

          assert version("chess-mentor-engine") == "1.0.0"
          package_root = files("chess_mentor_engine")
          assert package_root.joinpath("py.typed").is_file()
          data_root = package_root.joinpath("chess_knowledge", "data")
          for filename in ("ontology.v1.json", "strategy.v1.json"):
              payload = json.loads(data_root.joinpath(filename).read_text(encoding="utf-8"))
              assert isinstance(payload, dict)
          PY

  stockfish-integration:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Install external Stockfish witness
        run: |
          sudo apt-get update
          sudo apt-get install -y stockfish
          STOCKFISH_PATH="$(command -v stockfish || true)"
          if [ -z "$STOCKFISH_PATH" ] && [ -x /usr/games/stockfish ]; then
            STOCKFISH_PATH=/usr/games/stockfish
          fi
          test -n "$STOCKFISH_PATH"
          test -x "$STOCKFISH_PATH"
          echo "STOCKFISH_EXECUTABLE=$STOCKFISH_PATH" >> "$GITHUB_ENV"

      - name: Run external Stockfish qualification
        run: pytest tests/integration/test_stockfish_uci.py
