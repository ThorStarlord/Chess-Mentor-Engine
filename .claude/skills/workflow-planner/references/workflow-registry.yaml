# auto_invoke_next_workflow semantics (ADR 0026):
# These fields are COMPATIBILITY / HISTORICAL TRANSITION METADATA only. They do
# NOT grant execution authority. A workflow may execute only after a SEPARATE
# explicit authority event from the active agent/human authority model.
# recommendation != selection != execution authorization; knowable != authorized.
# The auto-invocation consumers surface the candidate and fail closed (no
# automatic child-workflow spawn) in the absence of such an event.
workflows:
- id: fast-path-workflow
  display_name: Fast Path - Diagnostic & Orchestration
  purpose: Diagnose a repository and automatically invoke the recommended implementation
    workflow.
  description: Use this when you have a clear repo goal. Analyzes the repository,
    produces a diagnostic brief, selects the best implementation workflow, and automatically
    invokes it. The workflow-runtime reads the orchestration-plan and chains to the
    implementation workflow without user intervention.
  initial_inputs:
  - id: user_intent
    type: artifact
    required: true
    description: User's problem statement and scope mode (created by workflow-runtime)
  - id: repository_state
    type: external_context
    required: true
    description: Current repository files, folder structure, README, documentation,
      and git state.
  allowed_execution_modes:
  - plan_only
  - prompt_chain
  - guided_execution
  - autonomous_execution
  steps:
  - id: 1
    skill: repo-sensemaker
    step_type: local_execution
    gate: review_diagnosis
    input_source: repository_state
    output_artifact: repository_sensemaking_brief
  - id: 2
    skill: workflow-planner
    step_type: local_execution
    gate: review_orchestration_plan
    input_artifact: repository_sensemaking_brief
    output_artifact: workflow_orchestration_plan
  auto_invoke_next_workflow: true
  auto_invoke_source: workflow_orchestration_plan.recommended_workflow_id
- id: full-fog-workflow
  display_name: Full Fog Path - Comprehensive Sensemaking & Orchestration
  purpose: Comprehensively analyze ambiguous projects from raw fog through diagnosis
    and produce a bounded downstream recommendation for active-agent review.
  description: Use when the problem is vague or highly uncertain. Chains problem framing,
    unknown mapping, repository diagnosis, and workflow planning, then returns the
    recommendation to the active agent. It does not automatically execute a downstream workflow.
  initial_inputs:
  - id: user_intent
    type: artifact
    required: true
    description: User's problem statement and scope mode (created by workflow-runtime)
  - id: raw_fog
    type: external_context
    required: true
    description: Vague problem statement, project goals, team context, and current
      state of confusion.
  - id: repository_state
    type: external_context
    required: true
    description: Current repository files, folder structure, README, documentation,
      and git state.
  allowed_execution_modes:
  - plan_only
  - prompt_chain
  - guided_execution
  - autonomous_execution
  steps:
  - id: 1
    skill: problem-framer
    step_type: local_execution
    gate: review_problem_frame
    input_source: raw_fog
    output_artifact: problem_frame
  - id: 2
    skill: unknowns-mapper
    step_type: local_execution
    gate: review_unknowns_map
    input_artifact: problem_frame
    output_artifact: unknowns_map
  - id: 3
    skill: repo-sensemaker
    step_type: local_execution
    gate: review_diagnosis
    input_source: repository_state
    output_artifact: repository_sensemaking_brief
  - id: 4
    skill: workflow-planner
    step_type: local_execution
    gate: review_orchestration_plan
    input_artifact: repository_sensemaking_brief
    output_artifact: workflow_orchestration_plan
- id: setup-sensemaking-repo
  display_name: Setup Sensemaking Repo
  purpose: Configure repository agent docs, artifact contracts, execution mode defaults,
    and downstream skill mappings.
  initial_inputs:
  - id: repository_state
    type: external_context
    required: true
    description: Current repository files, registries, templates, validator scripts,
      and git state.
  allowed_execution_modes:
  - plan_only
  - prompt_chain
  - guided_execution
  steps:
  - id: 1
    skill: setup-sensemaking-skills
    step_type: local_execution
    gate: review_setup_plan
    input_source: repository_state
  - id: 2
    skill: repo-sensemaker
    step_type: local_execution
    gate: review_repo_brief
    input_source: repository_state
    output_artifact: repository_sensemaking_brief
  - id: 3
    skill: handoff
    step_type: local_execution
    gate: review_handoff_prompt
    input_artifact: repository_sensemaking_brief
    output_artifact: session_summary
- id: docs-contract-reconciliation
  display_name: Docs & Contract Reconciliation
  purpose: Resolve drift between documentation, registries, artifact contracts, templates,
    and validator rules.
  initial_inputs:
  - id: repository_state
    type: external_context
    required: true
    description: Current repository files, registries, templates, validator scripts,
      and git state.
  - id: prior_evidence
    type: external_context
    required: false
    description: Prior briefs, postmortems, and evidence records about this target
      (e.g. experiments/evidence/NNNN-*, docs/reviews/*, vendored-skill drift
      findings from the probe's skill_distribution section). repo-sensemaker must
      consult these before producing the brief so framework learnings captured
      after the target vendored its skills still reach the executor (evidence 0018).
  allowed_execution_modes:
  - plan_only
  - prompt_chain
  - guided_execution
  steps:
  - id: 1
    skill: repo-sensemaker
    step_type: local_execution
    gate: review_drift_diagnosis
    input_source: repository_state
    output_artifact: repository_sensemaking_brief
  - id: 2
    skill: sensemaking-docs-reconciler
    step_type: local_execution
    gate: review_reconciliation_patch
    input_artifact: repository_sensemaking_brief
    output_artifact: docs_contract_reconciliation_report
  - id: 3
    skill: repair-verifier
    step_type: local_execution
    gate: review_reconciliation_verified
    input_artifact: docs_contract_reconciliation_report
    input_source: repository_state
    output_artifact: repair_verification_report
    description: Re-run the probe after the patch and check the original
      brief's findings no longer reproduce (structural closure); remaining
      findings must be fixed or deferred with a reason.
  - id: 4
    skill: handoff
    step_type: local_execution
    gate: review_next_prompt
    input_artifact: repair_verification_report
    output_artifact: session_summary
- id: artifact-reconciliation
  display_name: Artifact Reconciliation (Handoff Audit)
  purpose: Verify claims about completed work (work_claim artifacts such as
    handoffs, task summaries, or status reports) against durable repository
    artifacts; produce a reconciled analysis with verified/disputed/omitted
    claims and actionable findings.
  initial_inputs:
  - id: work_claim
    type: artifact
    required: true
    description: The handoff/task summary whose claims are audited (docs/reviews/*,
      docs/handoffs/*, an evidence record, or a pasted task summary).
  - id: repository_state
    type: external_context
    required: true
    description: The repo whose artifacts ground the audit (probe report, evidence
      records, merged HEAD, validator outputs).
  - id: prior_evidence
    type: external_context
    required: false
    description: Prior briefs/postmortems/evidence records about the target; the
      output of a previous artifact-reconciliation run feeds the next (closed loop).
  allowed_execution_modes:
  - plan_only
  - guided_execution
  steps:
  - id: 1
    skill: repo-sensemaker
    step_type: local_execution
    gate: review_audit_diagnosis
    input_source: repository_state
    output_artifact: repository_sensemaking_brief
  - id: 2
    skill: output-reconciler
    step_type: local_execution
    gate: review_reconciliation
    input_artifact: repository_sensemaking_brief
    input_source: prior_evidence
    output_artifact: reconciliation_report
    description: work_claim and prior_evidence are supplied from the run
      context (initial_inputs); repo-sensemaker's brief grounds the audit.
  - id: 3
    skill: to-issues
    step_type: local_execution
    gate: review_issues
    input_artifact: reconciliation_report
    output_artifact: issue_list
  - id: 4
    skill: handoff
    step_type: local_execution
    gate: review_next_prompt
    input_artifact: issue_list
    output_artifact: session_summary
- id: autonomous-sprint-preflight
  display_name: Autonomous Sprint Preflight
  purpose: Verify that a repository is ready for Autonomous Sprint before selecting
