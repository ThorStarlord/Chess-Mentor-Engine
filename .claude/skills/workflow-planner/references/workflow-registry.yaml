- id: skill-evaluation-workflow
  display_name: Skill Evaluation & Maintenance Workflow
  purpose: Evaluate skill performance in realistic scenarios and implement improvements.
  description: Use this to run usage research on a skill in a specific scenario, then
    translate findings into maintenance improvements. Chain usage-researcher → skill-maintainer
    for the complete feedback loop.
  initial_inputs:
  - id: scenario_context
    type: external_context
    required: true
    description: The target skill, scenario fixtures, and expected behavior definition.
  allowed_execution_modes:
  - guided_execution
  - autonomous_execution
  requires_run_log: true
  steps:
  - id: 1
    skill: usage-researcher
    step_type: local_execution
    gate: review_findings
    input_source: scenario_context
    output_artifact: usage_research_report
    description: Research phase - observe skill behavior and classify findings
  - id: 2
    skill: skill-maintainer
    step_type: local_execution
    gate: review_improvement_plan
    input_artifact: usage_research_report
    input_source: scenario_context
    output_artifact: skill_improvement_plan
    description: Maintenance phase - translate findings into auditable improvements
  - id: 3
    skill: handoff
    step_type: local_execution
    gate: session_close
    input_artifact: skill_improvement_plan
    output_artifact: session_summary
- id: architectural-review-planning-workflow
  display_name: Architectural Review Planning
  purpose: Evaluate a proposed architectural response against repository diagnostics and risks.
  description: Analyze a proposed direction (feature, capability, refactor) against the current
    repository state and provide architectural guidance. Produces a decision and risk analysis
    to inform implementation planning.
  initial_inputs:
  - id: repository_state
    type: external_context
    required: true
    description: Current repository files, folder structure, README, documentation, and git
      state.
  - id: proposed_direction
    type: external_context
    required: true
    description: The proposed architectural response, feature, or capability to evaluate.
  allowed_execution_modes:
  - plan_only
  - prompt_chain
  - guided_execution
  - autonomous_execution
  steps:
  - id: 1
    skill: repo-sensemaker
    step_type: local_execution
    gate: review_diagnosis
    input_source: repository_state
    output_artifact: repository_sensemaking_brief
    description: Diagnose repository state and identify the weakest boundary
  - id: 2
    skill: architectural-review
    step_type: local_execution
    gate: review_recommendation
    input_artifact: repository_sensemaking_brief
    input_source: proposed_direction
    output_artifact: architectural_review_recommendation
    description: Evaluate proposed response against diagnosed fog and identify risks
