# Skill Registry: Sensemaking Toolkit

ecosystems:
  core:
    name: Core Sensemaking
    skills:
      - id: problem-framer
        purpose: frame the problem behind the problem
        artifact: problem_frame
        availability: { type: local_command, executable_by_orchestrator: true, requires_installed_skill: true }
        invocation: { runtime: claude_code, command: "/problem-framer" }
      - id: unknowns-mapper
        purpose: map knowns, unknowns, and assumptions
        artifact: unknowns_map
        availability: { type: local_command, executable_by_orchestrator: true, requires_installed_skill: true }
        invocation: { runtime: claude_code, command: "/unknowns-mapper" }
      - id: repo-sensemaker
        purpose: diagnose repository shape and weakest boundary
        artifact: repository_sensemaking_brief
        availability: { type: local_command, executable_by_orchestrator: true, requires_installed_skill: true }
        invocation: { runtime: claude_code, command: "/repo-sensemaker" }
      - id: repository-semantic-steward
        purpose: bootstrap, recall and reconcile source-grounded repository architecture memory
        availability: { type: local, executable_by_orchestrator: false, requires_installed_skill: true }
        status: current
      - id: strategic-repository-analysis
        purpose: model repository evolution paths and strategic tradeoffs
        artifact: strategic_repository_analysis
        availability: { type: local_command, executable_by_orchestrator: true, requires_installed_skill: true }
        invocation: { runtime: claude_code, command: "/strategic-repository-analysis" }
      - id: strategic-sensemaking-loop
        purpose: start or resume end-to-end strategic repository Sensemaking from one prompt
        artifact: session_summary
        availability: { type: local_command, executable_by_orchestrator: true, requires_installed_skill: true }
        invocation: { runtime: claude_code, command: "/strategic-sensemaking-loop" }
      - id: strategic-repository-reconciliation
        purpose: reconcile returned evidence against a prior strategic analysis
        artifact: strategic_reconciliation
        availability: { type: local_command, executable_by_orchestrator: true, requires_installed_skill: true }
        invocation: { runtime: claude_code, command: "/strategic-repository-reconciliation" }
      - id: owner-decision-capsule
        purpose: package an owner-reserved decision without selecting it
        artifact: owner_decision_capsule
        availability: { type: local_command, executable_by_orchestrator: true, requires_installed_skill: true }
        invocation: { runtime: claude_code, command: "/owner-decision-capsule" }
      - id: thesis-review-packet
        purpose: prepare a Level-4 thesis review without ratifying it
        artifact: thesis_review_packet
        availability: { type: local_command, executable_by_orchestrator: true, requires_installed_skill: true }
        invocation: { runtime: claude_code, command: "/thesis-review-packet" }
      - id: external-evidence-packet
        purpose: preserve decision-relevant external evidence provenance and currentness
        artifact: external_evidence_packet
        availability: { type: local_command, executable_by_orchestrator: true, requires_installed_skill: true }
        invocation: { runtime: claude_code, command: "/external-evidence-packet" }
      - id: multi-repository-strategic-analysis
        purpose: analyze explicit repository boundaries and capability allocations
        artifact: multi_repository_strategic_analysis
        availability: { type: local_command, executable_by_orchestrator: true, requires_installed_skill: true }
        invocation: { runtime: claude_code, command: "/multi-repository-strategic-analysis" }
      - id: change-impact-analysis
        purpose: analyze decision-relevant affected surfaces around a bounded change
        artifact: change_impact_analysis
        availability: { type: local_command, executable_by_orchestrator: true, requires_installed_skill: true }
        invocation: { runtime: claude_code, command: "/change-impact-analysis" }
      - id: workflow-planner
        purpose: select and configure the recommended workflow for execution
        artifact: workflow_orchestration_plan
        availability: { type: local_command, executable_by_orchestrator: true, requires_installed_skill: true }
        invocation: { runtime: claude_code, command: "/workflow-planner" }
