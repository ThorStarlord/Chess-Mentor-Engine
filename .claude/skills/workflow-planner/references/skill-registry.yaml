        invocation: { runtime: claude_code, command: "/architectural-review", input_artifact: repository_sensemaking_brief, input_source: proposed_direction, output_artifact: architectural_review_recommendation }
      - id: sensemaking-docs-reconciler
        purpose: align repository docs, registries, and contracts
        artifact: docs_contract_reconciliation_report
        availability: { type: local, executable_by_orchestrator: true, requires_installed_skill: true }
        capabilities: [write_files]
      - id: output-reconciler
        purpose: verify claims about completed work against durable artifacts
        artifact: reconciliation_report
        availability: { type: local, executable_by_orchestrator: true, requires_installed_skill: true }
        capabilities: [write_files]
      - id: repair-verifier
