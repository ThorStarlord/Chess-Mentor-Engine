      - prompt-handoff
      - output-reconciler
      - repair-verifier
      - strategic-repository-reconciliation
    description: "Evidence-grounded affected-surface analysis around a bounded contemplated or completed change, including verification/reconciliation/authority consequences and bounded follow-up responsibilities"
    required_sections:
      - change_scope_and_authority
      - impact_evidence
      - affected_surfaces
      - cross_repository_impact
      - claim_and_verification_consequences
      - bounded_follow_up_responsibilities
      - closure_effect
      - authority_and_claim_boundaries
      - machine_readable_summary
    required_machine_fields:
      - artifact_id
      - analysis_ref
      - target_repository
      - target_source_identity
      - change
      - impact_items
      - cross_repository_impacts
      - claim_consequences
      - followup_responsibilities
      - closure_effect
      - automatic_repository_discovery_performed
      - change_authorized_by_artifact
      - followup_execution_authorized_by_artifact
      - semantic_truth_established
      - created_at
