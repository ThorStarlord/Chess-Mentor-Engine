  - id: workflow_orchestration_plan
    path: "artifacts/plan_{workflow_id}.md"
    produced_by: workflow-planner
    consumed_by:
      - user
      - agents (autonomous_execution)
    description: "Phase 1 diagnostic plan: workflow routing and step definition for agent execution"
    required_sections:
      - brief_consumed
      - chosen_workflow
      - why_this_workflow
      - workflow_steps_definition
      - machine_readable_plan
    required_machine_fields:
      - artifact_id
      - primary_fog_type
      - chosen_workflow_id
      - routing_decision_method
      - workflow_steps
      - created_at
    recommended_machine_fields:
      # The plan may carry the diagnosed fog type so routing/validation can read it
      # directly from the plan (ADR 0005). If absent, the runtime falls back to the
      # repository_sensemaking_brief (primary_fog_type / user_implied_fog_type).
      - source_intent_ref
      - execution_mode
      - system_recommended_workflow
      - selected_workflow
      - routing_divergence
      - escalation_recommended
      - auto_escalation_allowed
      - approval_gates
      - gate_behavior
      - stop_conditions
      - subset_run
      - subset_reason
      - included_steps
      - excluded_steps
    notes:
      - "Validation results are NOT stored in this artifact. See validators/run_log.md for validation output."
      - "PATH B (transient validation): validation_status field is NOT present."
      - "Phase 1 diagnostic scope: plan prepares agent for Phase 2 implementation workflow execution."
      - "workflow_steps is a structured array defining skill sequence: [{step_id, skill, input_artifact, output_artifact, gate, description}, ...]"
      - "ADR 0025 two-stage lifecycle: the runtime's generate_plan() emits a PROVISIONAL execution skeleton (flagged `plan_stage: provisional`) at Phase 2 before the repository_sensemaking_brief exists; it is NOT the canonical contract-valid plan and may omit primary_fog_type / workflow_steps / created_at. The canonical plan exists only after finalize_plan(brief_path) consumes the brief's real primary_fog_type. Only the finalized plan is required to satisfy validate-plan.py / validate-artifact.py."
    verification:
      generic_validator: "python scripts/validate-artifact.py workflow_orchestration_plan {artifact_path}"
      specialized_validators:
        - "python scripts/validate-plan.py {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

