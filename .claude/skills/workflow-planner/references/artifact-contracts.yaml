# Artifact Contracts: Sensemaking Pipeline

artifacts:
  - id: user_intent
    path: "artifacts/user_intent.md"
    produced_by: workflow-runtime
    consumed_by:
      - problem-framer
      - unknowns-mapper
      - repo-sensemaker
      - workflow-planner
      - docs-aligner
      - to-prd
      - to-issues
      - triage
      - handoff
    required_sections:
      - raw_intent
      - scope_mode
      - intent_source
      - constraints
      - non_goals
      - machine_readable_intent
    required_machine_fields:
      - artifact_id
      - intent_source
      - scope_mode
      - raw_problem_statement
      - created_at
      - immutable
    verification:
      generic_validator: "python scripts/validate-artifact.py user_intent {artifact_path}"
      specialized_validators:
        - "python scripts/validate-user-intent.py {artifact_path}"
      required_for_modes:
        - plan_only
        - prompt_chain
        - guided_execution
        - autonomous_execution
        - yolo_execution

  - id: user_intent_amendment
    path: "artifacts/user_intent_amendment.md"
