  # Prospective reasoning (docs/semantic-architecture/prospective-reasoning-ontology.md).
  # Authored under the Steward's architecture-exploration procedure when a
  # multi-option comparison must outlive the session; no separate Skill.
  - id: architectural_synthesis
    path: "artifacts/architectural_synthesis.md"
    produced_by: repository-semantic-steward
    consumed_by:
      - user
      - repository-semantic-steward
      - strategic-repository-analysis
    description: "Source-grounded comparison of materially different architectural options for target product possibilities: current architecture, proposed structures and transitions, assumptions, conditional consequences, qualitative comparison, an optional provisional preference with its feedback, and decision-changing uncertainty"
    required_sections:
      - governing_intent_and_scope
      - target_possibilities
      - current_architecture
      - architecture_options
      - option_comparison
      - consequence_exploration
      - provisional_preference_and_feedback
      - unresolved_questions
      - authority_and_claim_boundaries
      - evidence
      - machine_readable_summary
    required_machine_fields:
      - artifact_id
      - schema_version
      - target_repository
      - target_source_identity
      - governing_intent_refs
      - target_possibility_refs
      - current_architecture_refs
      - architecture_options
      - option_comparison
      - provisional_preference
      - unresolved_questions
      - implementation_authority_established_by_artifact
      - semantic_truth_established
      - created_at
      - immutable
    recommended_machine_fields:
      - analysis_ref
      - preference_feedback
      - derived_possibility_refs
      - candidate_responsibility
      - reconsideration_conditions
    notes:
      - "Authoring template: skills/repository-semantic-steward/references/architectural-synthesis-template.md."
      - "A synthesis compares at least two materially different options; a single concrete proposal goes to architectural-review as a proposed_direction, whose input/output contract is unchanged."
      - "Options are proposals: proposed_transitions name what would change (target_ref, change), never what has changed."
      - "provisional_preference is null (state no_preference_reason) or status PROVISIONAL with attribution; it is never a selection or decision, and exactly the preferred option carries comparison_outcome PROVISIONALLY_PREFERRED."
      - "preference_feedback links a conditional consequence (conseq: id cited by an option) to a feedback outcome; outcomes are analysis results, not dispositions."
      - "Optional conditional_consequences type each cited consequence (category benefit/risk/constraint/opportunity/mixed, effect, assumption_refs kept apart from observed_premise_refs, would_change_decision_if); when present, option refs and entries must match one to one. Optional consequence_stop_reason records why depth stopped."
      - "Consequences are predictions. Observed effects of a built change belong to steward RECONCILE or change_impact_analysis, never back in the synthesis. No standalone consequence artifact exists: consequences have no authorship, reuse or consumer apart from their synthesis."
      - "Numeric score/weight/rank fields are forbidden; comparison is qualitative and attributed."
      - "Ids and paths that leave the artifact are shape-checked only; --resolve-references reports which are defined in the artifact, recorded in reviewed knowledge (JSON records and ADR files), existing paths, or unresolved, and never changes validity."
      - "Reviewed knowledge records for options and consequences remain optional and follow the knowledge contract's prospective reasoning convention."
      - "implementation_authority_established_by_artifact and semantic_truth_established must remain false."
    verification:
      generic_validator: "python scripts/validate-artifact.py architectural_synthesis {artifact_path}"
      specialized_validators:
        - "python scripts/validate-architectural-synthesis.py {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

  # Session receipts (proposed ADR 0032). Whole-file YAML records, not
  # Markdown documents: they live in the TARGET repository under
  # .sensemaking/receipts/ (never ingested by the semantic knowledge index) and
  # survive only when committed/pushed or uploaded by the host. Schema and
  # field caps: the reference docs named in `schema_reference`; every rule is
  # enforced by scripts/validate-receipt.py, the single validator for both ids.
  - id: sensemaking_session_receipt
    path: ".sensemaking/receipts/{session_id}.session.yaml"
    produced_by: using-sensemaking
    consumed_by:
      - using-sensemaking
      - strategic-sensemaking-loop
      - handoff
      - user
    description: "Typed flight-recorder record of one control-loop session: goal, delegated authority, responsibilities run, consequential findings, open questions, stop disposition and next warranted responsibility"
    format: yaml
    schema_reference: skills/using-sensemaking/references/session-receipt-v1.md
    required_machine_fields:
      - artifact_id
      - schema_version
      - session_ref
      - state
      - created_at
      - updated_at
      - target_repository
      - source_identity
      - skill_identity
      - goal
      - delegation
      - continuity
      - responsibilities
      - findings
      - open_questions
      - stop
      - next
      - persistence
      - claim_ceiling
      - action_authorized_by_receipt
      - immutable
    notes:
      - "Opened in_progress once goal and authority are established, updated at checkpoints, finalized (immutable) at stop; a later session never edits a final receipt."
      - "Read at session start through scripts/summarize-receipts.py (unfinished sessions, open questions, next responsibility, pending/repeated knowledge misses)."
      - "Records authority; never grants it. action_authorized_by_receipt must remain false."
      - "Text fields are capped (300/120 characters): the receipt carries facts and repository-relative pointers, never narrative or reasoning."
    verification:
      generic_validator: "python scripts/validate-receipt.py {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution

  - id: semantic_query_receipt
    path: ".sensemaking/receipts/{session_id}.query.yaml"
    produced_by: repository-semantic-steward
    consumed_by:
