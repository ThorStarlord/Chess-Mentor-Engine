  - id: repository_sensemaking_brief
    path: "artifacts/repository_sensemaking_brief.md"
    produced_by: repo-sensemaker
    consumed_by:
      - workflow-planner
      - prompt-handoff
      - sensemaking-docs-reconciler
      - output-reconciler
    description: "Phase 1 diagnostic artifact: fog type classification and handoff to workflow-planner"
    required_sections:
      - evidence
      - recommended_workflow
    required_machine_fields:
      - artifact_id
      - primary_fog_type
      - evidence
      - created_at
      - immutable
    recommended_machine_fields:
      - source_intent_ref
      - user_implied_fog_type
      - diagnosis_conflict
      - escalation_recommended
      - escalation_target
      - escalation_reason
      - auto_escalation_allowed
      - weakness_type
      - weakness_type_explanation
      # directive #23/#28: recommended_workflow_id is required for ACTION briefs
      # but is authoritatively optional under an EXPLICIT outcome =
      # NO_REPOSITORY_CHANGE_WARRANTED (validated by validate-brief.py, NOT the
      # generic validate-artifact.py which must not universally require it).
      - recommended_workflow_id
      # directive #23/#25/#28: representation_sufficiency + outcome are
      # programmatically consumed by the MODEL_WARRANT seam and the NO_CHANGE
      # terminal path, respectively. Declared here (per ADR 0015: any field a
      # downstream consumer parses programmatically belongs in the declared
      # machine contract) as OPTIONAL/ADDITIVE -- absent/invalid fails closed
      # (INCONCLUSIVE / normal-action) and is not a generic-validator failure.
      - representation_sufficiency
      - outcome
      # Issue #171 / evidence-rules Rule 7: REQUIRED (blocking) when the
      # brief recommends renumbering/deduplicating a colliding ID. Value is
      # the direction decision with reference counts per candidate, prior
      # dedup intent, and grep result incl. handoffs.
      - collision_dedup_direction
      # Section 15 "extended_analysis" fields (ADR 0024, ACCEPTED): classified
      # per ADR 0015 as "model, constrained" (same class as weakness_type),
      # all OPTIONAL, all non-blocking -- a stronger guarantee than
      # weakness_type's "required but non-blocking" (D2). Live in a single
      # Section 15 `extended_analysis:` YAML mapping (`## 15. Extended
      # analysis`), not Section 13. Absence changes nothing; presence never
      # fails validate-brief.py.
      - extended_analysis.domain
      - extended_analysis.consequential_boundary
      - extended_analysis.uncertainty
      - extended_analysis.owner_intent_state
    notes:
      - "Validation results are NOT stored in this artifact. See validators/run_log.md for validation output."
      - "PATH B (transient validation): validation_status field is NOT present."
      - "Phase 1 diagnostic scope: brief prepares handoff to workflow-planner for Phase 2 implementation."
      - "weakness_type (issue #80): structured taxonomy field in Section 13. Allowed values are the 7 registered types in skills/repo-sensemaker/references/weakness-types.md plus 'Other'. Required metadata but non-blocking (D2) -- missing/unrecognized values are validator warnings, never errors. weakness_type_explanation is required only when weakness_type is 'Other' (D4); its absence there is also a non-blocking warning that must be resolved before human final-approval."
      - "user_implied_fog_type (Goal A PF-1): recommended, optional. Legal values are the four fog types PLUS 'unknown' (intent is fog-neutral) -- declared in docs/canonical-vocabulary.yaml routing_fields, the single source of truth both validate-artifact.py and validate-fog-type-normalization.py read. Distinct from primary_fog_type (the diagnosis), which is always one of the four and never 'unknown'. validate-brief.py does not enum-check this field."
      - "extended_analysis (Section 15, ADR 0024 ACCEPTED): optional, non-blocking, model-constrained. Not read by workflow-runtime.py's routing (_WORKFLOW_ID_FIELDS / _FOG_TYPE_FIELDS) -- see tests/test_field_contract_agreement.py, whose guard this deliberately does not need to touch. Any future promotion to drive real routing requires a new owner decision per field."
      - "recommended_workflow_id (no-match semantics, ADR 0014): while downstream routing is deferred, the Brief may truthfully carry no workflow recommendation by emitting `recommended_workflow_id: null` together with `escalation_recommended: true`. A null value is valid only in that combination; otherwise the field must name a valid registry workflow id (validate-brief.py enforces this). This documents the no-match state; it does not ratify routing or ADR 0018."
    verification:
      generic_validator: "python scripts/validate-artifact.py repository_sensemaking_brief {artifact_path}"
      specialized_validators:
        - "python scripts/validate-brief.py {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

  - id: strategic_repository_analysis
    path: "artifacts/strategic_repository_analysis.md"
    produced_by: strategic-repository-analysis
    consumed_by:
      - user
      - workflow-planner
      - prompt-handoff
      - architectural-review
    description: "Level-3 repository evolution analysis: current system model, capability state, construction paths, qualitative comparison, decision-changing uncertainty, and strategic disposition"
    required_sections:
      - governing_intent_and_scope
      - current_system_model
      - capability_and_limitation_map
      - strategic_frontier
      - candidate_construction_paths
      - qualitative_path_comparison
      - decision_changing_uncertainty
      - strategic_synthesis
      - warranted_direction
      - authority_and_claim_boundaries
      - evidence
      - machine_readable_summary
    required_machine_fields:
      - artifact_id
      - target_repository
      - target_source_identity
      - governing_intent
      - capability_states
      - strategic_frontier
      - construction_paths
      - path_comparison
      - decision_changing_uncertainty
      - strategic_disposition
      - selected_path_id
      - candidate_repository_responsibility
      - smallest_warranted_intervention
      - implementation_authority_established_by_artifact
      - semantic_truth_established
      - created_at
      - immutable
    recommended_machine_fields:
      - schema_version
      - analysis_ref
      - continuity
      - decision_assumptions
      - governing_authority_refs
      - candidate_path_transition_ref
    notes:
      - "Strategic analysis is semantic-agent output; the validator does not choose, score, rank, or authorize a path."
      - "New canonical strategic_repository_analysis artifacts use schema_version: 2; missing schema_version means legacy v1 and remains valid without mutation."
      - "v2 Strategic Frontier entries declare evidence_refs, affected_capability_ids, and strategic_consequence; v2 paths declare frontier_refs, why_plausible, builds_on_capability_ids, and required_capability_ids."
      - "v2 comparison uses nine strategic lenses; smallest_warranted_intervention is derived after strategic disposition/path selection rather than used as a path-selection lens."
      - "analysis_ref, continuity, decision_assumptions, governing_authority_refs, path_transitions, and candidate_path_transition_ref are additive Strategic Continuity fields; existing qualified analyses remain valid without them."
      - "continuity is semantic-agent authored; deterministic commands may project or compare it but may not infer it."
      - "Construction paths are coherent repository-evolution trajectories, not backlogs."
      - "Optional path_transitions are stable conceptual transition references for reconstruction; they are not roadmap tasks, schedules, progress fields, or automatic next actions."
      - "Optional prospective links: top-level architecture_synthesis_refs cites architectural_synthesis artifacts; per-path possibility_refs (poss: ids) and architecture_option_refs (arch: ids) record a path's basis. Citing an option on a path does not select or authorize it."
      - "Prospective links are prefix-checked only: resolve possibility_refs and architecture_option_refs through the cited synthesis or knowledge-query explain; strategy drift checks architecture_synthesis_refs paths for presence and change."
      - "construction_paths may contain 0-5 real paths; zero is valid for non-BUILD dispositions when no coherent construction trajectory is currently warranted/representable. BUILD still requires a selected real path."
      - "Numeric path scores/weights/ranking fields are forbidden; comparison is qualitative."
      - "implementation_authority_established_by_artifact and semantic_truth_established must remain false."
    verification:
      generic_validator: "python scripts/validate-artifact.py strategic_repository_analysis {artifact_path}"
      specialized_validators:
        - "python scripts/validate-strategic-repository-analysis.py {artifact_path}"
      required_for_modes:
        - guided_execution
        - autonomous_execution
        - yolo_execution

