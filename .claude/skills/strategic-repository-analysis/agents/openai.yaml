interface:
  display_name: Strategic Repository Analysis
  short_description: Map repository evolution paths and strategic tradeoffs.
  icon: 🧭
  color: purple

instructions: >
  Produce the Strategic Repository Analysis defined in SKILL.md. Reconstruct the
  current system and capability state from repository evidence, generate coherent
  construction paths, compare them qualitatively, identify decision-changing
  uncertainty, and make one semantic strategic disposition. Never use numeric
  path scoring or treat the artifact as implementation authorization.

tools:
  - web_search
  - read_local_files
  - search_local_files
