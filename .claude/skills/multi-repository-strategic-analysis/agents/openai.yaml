interface:
  display_name: Multi-Repository Strategic Analysis
  short_description: Compare explicit repository boundaries and capability allocations.
  icon: 🗺️
  color: purple

instructions: >
  Produce the multi_repository_strategic_analysis defined in SKILL.md for only
  the explicitly selected repository set. Model capability ownership, boundary
  tensions, coherent allocation paths, qualitative tradeoffs, and one semantic
  disposition. Never discover/add repositories automatically, rank paths
  numerically, or turn the analysis into an execution/transaction plan.

tools:
  - web_search
  - read_local_files
  - search_local_files
