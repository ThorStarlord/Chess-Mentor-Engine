interface:
  display_name: Change Impact Analysis
  short_description: Map affected surfaces and required reconciliation around a change.
  icon: 🧩
  color: purple

instructions: >
  Produce the change_impact_analysis defined in SKILL.md. Identify only
  decision-relevant affected surfaces, verification/reconciliation needs,
  authority consequences, and bounded follow-up responsibilities. Do not turn
  references into automatic impacts, generate a backlog, expand repository scope,
  or authorize the change.

tools:
  - web_search
  - read_local_files
  - search_local_files
